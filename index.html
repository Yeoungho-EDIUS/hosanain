<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사 프로젝트 노트</title>
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2b2622; --muted:#8a8178;
    --line:#e7dfd3; --accent:#8a5a2b; --accent-soft:#f3e9dc;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}
  header{padding:8px 0 18px}
  header small{color:var(--accent);font-weight:700;letter-spacing:.04em}
  h1{margin:4px 0 0;font-size:1.6rem;line-height:1.3}
  section{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:14px}
  h2{margin:0 0 10px;font-size:1rem;color:var(--accent)}
  label.sub{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
  input[type=text],textarea{width:100%;font:inherit;color:inherit;background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
  input[type=text]:focus,textarea:focus{border-color:var(--accent);background:#fff}
  textarea{resize:vertical;min-height:44px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .chk{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .chk input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}
  .chk input[type=text]{flex:1}
  .chk.done input[type=text]{text-decoration:line-through;color:var(--muted)}
  .timeline{position:relative;margin:4px 0 0;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
  .day{position:relative;padding-bottom:16px}
  .day:last-child{padding-bottom:0}
  .day::before{content:"";position:absolute;left:-26px;top:5px;width:16px;height:16px;border-radius:50%;
    background:var(--card);border:3px solid var(--accent);box-sizing:border-box}
  .day.today::before{background:var(--accent)}
  .day b{display:inline-block;background:var(--accent-soft);color:var(--accent);
    border-radius:999px;padding:2px 10px;font-size:.85rem;margin-bottom:6px}
  .angle{background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-top:6px}
  .angle span{font-size:.8rem;color:var(--muted);display:block}
  .angle strong{color:var(--accent)}
  @media (max-width:420px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <small>PROJECT NOTE</small>
    <h1>기사 프로젝트 노트</h1>
  </header>

  <section>
    <h2>프로젝트 한 줄</h2>
    <input type="text" data-k="brief" placeholder="브리프를 한 줄로 적어 주세요">
  </section>

  <section>
    <h2>팀 이름과 역할</h2>
    <label class="sub">팀 이름</label>
    <input type="text" data-k="team" placeholder="팀 이름">
    <label class="sub">팀원 (이름 · 역할)</label>
    <div class="row"><input type="text" data-k="m1n" placeholder="이름"><input type="text" data-k="m1r" placeholder="역할"></div>
    <div class="row"><input type="text" data-k="m2n" placeholder="이름"><input type="text" data-k="m2r" placeholder="역할"></div>
    <div class="row"><input type="text" data-k="m3n" placeholder="이름"><input type="text" data-k="m3r" placeholder="역할"></div>
    <div class="row"><input type="text" data-k="m4n" placeholder="이름"><input type="text" data-k="m4r" placeholder="역할"></div>
  </section>

  <section>
    <h2>주제</h2>
    <label class="sub">대주제</label>
    <input type="text" data-k="topic" placeholder="배정받은 대주제">
    <div class="angle">
      <span>내 앵글</span>
      <strong>내일 정함</strong>
    </div>
  </section>

  <section>
    <h2>할 일 체크리스트</h2>
    <div class="chk"><input type="checkbox" data-c="c1"><input type="text" data-k="t1" placeholder="할 일 1"></div>
    <div class="chk"><input type="checkbox" data-c="c2"><input type="text" data-k="t2" placeholder="할 일 2"></div>
    <div class="chk"><input type="checkbox" data-c="c3"><input type="text" data-k="t3" placeholder="할 일 3"></div>
    <div class="chk"><input type="checkbox" data-c="c4"><input type="text" data-k="t4" placeholder="할 일 4"></div>
    <div class="chk"><input type="checkbox" data-c="c5"><input type="text" data-k="t5" placeholder="할 일 5"></div>
  </section>

  <section>
    <h2>날짜별 기록</h2>
    <div class="timeline">
      <div class="day"><b>11/18</b><textarea data-k="d1118" rows="2" placeholder="한 줄 기록"></textarea></div>
      <div class="day today"><b>11/19 · 오늘</b><textarea data-k="d1119" rows="2" placeholder="오늘 한 줄"></textarea></div>
      <div class="day"><b>11/20</b><textarea data-k="d1120" rows="2" placeholder="한 줄 기록"></textarea></div>
    </div>
  </section>
</div>

<script>
(function(){
  var KEY="article-project-note-v1", data={};
  try{ data=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){}
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){} }
  document.querySelectorAll("[data-k]").forEach(function(el){
    var k=el.dataset.k; if(data[k]) el.value=data[k];
    el.addEventListener("input",function(){ data[k]=el.value; save(); });
  });
  document.querySelectorAll("[data-c]").forEach(function(el){
    var k=el.dataset.c, row=el.closest(".chk");
    el.checked=!!data[k]; row.classList.toggle("done",el.checked);
    el.addEventListener("change",function(){
      data[k]=el.checked; row.classList.toggle("done",el.checked); save();
    });
  });
})();
</script>
</body>
</html>
