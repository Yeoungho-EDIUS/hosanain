<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>작업 문의</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --ink:#eceff4; --muted:#9aa3b2; --accent:#f5b942; --danger:#ff6b6b; --ok:#5fd4a0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); line-height:1.6;
         font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:40px 18px 64px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 28px; font-size:15px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 18px; }
  .field { margin-bottom:18px; }
  label, .lab { display:block; font-weight:600; font-size:15px; margin-bottom:6px; }
  .hint { display:block; color:var(--muted); font-size:13px; margin:-2px 0 8px; }
  input[type=text], input[type=date], textarea {
    width:100%; padding:12px 13px; font:inherit; color:var(--ink); background:#0f1218;
    border:1.5px solid var(--line); border-radius:10px; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { min-height:130px; resize:vertical; }
  .count { text-align:right; color:var(--muted); font-size:12.5px; margin-top:4px; }
  .kinds { display:flex; flex-wrap:wrap; gap:8px; }
  .kinds input { position:absolute; opacity:0; pointer-events:none; }
  .kinds label { margin:0; padding:10px 14px; border:1.5px solid var(--line); border-radius:999px;
                 cursor:pointer; font-weight:500; font-size:14.5px; background:#0f1218; }
  .kinds input:checked + label { border-color:var(--accent); color:var(--accent); background:rgba(245,185,66,.08); }
  .kinds input:focus-visible + label { outline:2px solid var(--accent); }
  .note { margin-top:8px; color:var(--muted); font-size:13px; }
  .refnote { display:block; margin:0 0 8px; color:var(--accent); font-size:13px; }
  .refnote b { display:inline-block; padding:1px 8px; margin-right:6px; border:1px solid var(--accent);
               border-radius:999px; font-size:12px; font-weight:600; }
  .hp { position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden; }
  button { width:100%; padding:14px; font:inherit; font-size:16px; font-weight:700; color:#1a1405;
           background:var(--accent); border:0; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #status { margin-top:14px; min-height:24px; text-align:center; font-size:15px; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--danger); }
</style>
</head>
<body>
<main>
  <h1>작업 문의</h1>
  <p class="sub">필요한 내용을 남겨 주시면 확인 후 연락드립니다.</p>

  <form id="f" novalidate>
    <div class="field">
      <span class="lab">어떤 일로 문의하셨나요?</span>
      <div class="kinds">
        <input type="radio" name="type" id="t1" value="영상 제작" checked><label for="t1">영상 제작</label>
        <input type="radio" name="type" id="t2" value="촬영·생중계·행사 세팅"><label for="t2">촬영·생중계·행사 세팅</label>
        <input type="radio" name="type" id="t3" value="자막 중계"><label for="t3">자막 중계</label>
        <input type="radio" name="type" id="t4" value="자료 요청"><label for="t4">자료 요청</label>
        <input type="radio" name="type" id="t5" value="기타"><label for="t5">기타</label>
      </div>
    </div>

    <div class="field">
      <label for="name">성함을 알려 주세요.</label>
      <input type="text" id="name" maxlength="100" autocomplete="name" placeholder="예) 홍길동" required>
    </div>

    <div class="field">
      <label for="contact">답변을 받으실 연락처를 남겨 주세요.</label>
      <input type="text" id="contact" maxlength="200" placeholder="이메일 또는 전화번호" required>
    </div>

    <div class="field">
      <label for="content">문의하실 내용을 적어 주세요.</label>
      <span class="hint">행사명, 필요한 내용, 원하는 결과물을 함께 적어 주세요.</span>
      <textarea id="content" maxlength="2000" required></textarea>
      <div class="count"><span id="cnt1">0</span> / 2000</div>
    </div>

    <div class="field">
      <label for="plan">기획하신 내용을 알려 주세요.</label>
      <span class="hint">기획 의도, 주요 장면 구성, 필요한 자막·내레이션 등을 적어 주세요.</span>
      <span class="refnote"><b>참고</b> 영상 제작만 작성</span>
      <textarea id="plan" maxlength="2000"></textarea>
      <div class="count"><span id="cnt2">0</span> / 2000</div>
    </div>

    <div class="field">
      <label for="date">희망하시는 일정이 있으신가요?</label>
      <input type="date" id="date" required>
      <div class="note">제작 스케줄에 따라 일정이 변경될 수 있습니다.</div>
    </div>

    <!-- 스팸 방지용 숨김 칸: 사람은 보지 못하고 자동 입력 프로그램만 채웁니다 -->
    <div class="hp" aria-hidden="true">
      <label for="website">웹사이트</label>
      <input type="text" id="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" id="btn">문의 보내기</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
  var SUPABASE_URL = "https://dcjtbajwvkebthflgdro.supabase.co";
  var PUBLISHABLE_KEY = "sb_publishable_qrTx_UcbnhsIoWb_7cEbow_mvtPiG7W";

  var form = document.getElementById('f');
  var btn = document.getElementById('btn');
  var statusEl = document.getElementById('status');
  var contentEl = document.getElementById('content');
  var planEl = document.getElementById('plan');

  function bindCount(el, id) {
    el.addEventListener('input', function () {
      document.getElementById(id).textContent = el.value.length;
    });
  }
  bindCount(contentEl, 'cnt1');
  bindCount(planEl, 'cnt2');

  function show(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var name = document.getElementById('name').value.trim();
    var contact = document.getElementById('contact').value.trim();
    var content = contentEl.value.trim();
    var plan = planEl.value.trim();
    var date = document.getElementById('date').value;

    var type = form.querySelector('input[name=type]:checked').value;

    if (!name || !contact || !content || !date) {
      show('빈 칸이 있어요. 필수 항목을 입력해 주세요.', 'err'); return;
    }
    // 기획 내용은 '영상 제작' 문의일 때만 필수입니다
    if (type === '영상 제작' && !plan) {
      show('영상 제작 문의는 기획 내용을 적어 주세요.', 'err'); return;
    }
    if (contact.length < 3) { show('연락처를 확인해 주세요.', 'err'); return; }

    // 숨김 칸이 채워져 있으면 자동 입력으로 보고 저장하지 않습니다 (화면에는 성공처럼 보여 줍니다)
    if (document.getElementById('website').value) {
      show('문의가 접수됐습니다.', 'ok'); form.reset(); return;
    }

    var body = {
      inquiry_type: type,
      name: name,
      contact: contact,
      content: content,
      plan: plan || null,
      desired_date: date
    };

    btn.disabled = true; show('보내는 중...');

    fetch(SUPABASE_URL + '/rest/v1/inquiries', {
      method: 'POST',
      headers: {
        'apikey': PUBLISHABLE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (res.ok) {
        show('문의가 접수됐습니다.', 'ok');
        form.reset();
        document.getElementById('cnt1').textContent = '0';
        document.getElementById('cnt2').textContent = '0';
      } else {
        show('전송하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
      }
    }).catch(function () {
      show('전송하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'err');
    }).then(function () { btn.disabled = false; });
  });
</script>
</body>
</html>
